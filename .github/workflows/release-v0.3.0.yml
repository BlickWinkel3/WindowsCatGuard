name: Publish WindowsCatGuard 0.3.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.3.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and check
        shell: pwsh
        run: ./build.ps1
      - name: Package portable app
        shell: pwsh
        run: Compress-Archive -Path dist/WindowsCatGuard-win-x64/* -DestinationPath WindowsCatGuard-v0.3.0-win-x64.zip -CompressionLevel Optimal
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.3.0 WindowsCatGuard-v0.3.0-win-x64.zip --target "$env:GITHUB_SHA" --title "WindowsCatGuard 0.3.0" --notes-file release-notes/v0.3.0.md
